<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Particle Flow</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
           touch-action: none; cursor: crosshair; }
  #hint { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
          color: rgba(255,255,255,.65); font: 14px/1.4 system-ui, sans-serif;
          pointer-events: none; transition: opacity 1.5s; text-align: center;
          padding: 0 16px; width: max-content; max-width: calc(100% - 32px); }
  #meter { position: fixed; left: 12px; bottom: 12px; display: none; gap: 4px;
           align-items: flex-end; height: 40px; pointer-events: none; }
  #meter div { width: 8px; height: 2px; background: rgba(255,255,255,.6); border-radius: 2px; }
  #error { position: fixed; inset: 0; display: none; place-items: center; color: #fff;
           font: 16px system-ui, sans-serif; padding: 16px; text-align: center; }
  /* Settings: hidden in the top-right corner. Hovering there shows a small tile,
     clicking the tile opens the panel. */
  #corner { position: fixed; top: 0; right: 0; z-index: 10; box-sizing: border-box;
            min-width: 140px; min-height: 90px; padding: 10px;
            display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #tile { width: 36px; height: 36px; padding: 0; display: grid; place-items: center;
          border-radius: 10px; border: 1px solid rgba(255,255,255,.18);
          background: rgba(22,22,28,.75); color: rgba(255,255,255,.85); cursor: pointer;
          -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
          opacity: 0; transition: opacity .25s, background .15s; }
  #tile:hover { background: rgba(50,50,60,.85); }
  #tile:focus-visible { outline: 2px solid rgba(255,255,255,.6); outline-offset: 2px; }
  #corner:hover #tile, #corner.show #tile, #corner.open #tile, #tile:focus-visible { opacity: 1; }
  #panel { display: none; max-height: calc(100vh - 66px); overflow-y: auto;
           border-radius: 8px; }
  #corner.open #panel { display: block; }
  #panel .lil-gui.root { --width: 270px; }
  @media (max-width: 400px) { #panel .lil-gui.root { --width: calc(100vw - 20px); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Hold the mouse or touch to pull particles · settings in the top-right corner</div>
<div id="corner">
  <button id="tile" type="button" aria-label="Settings" title="Settings (H)" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2" fill="currentColor"/>
      <line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2" fill="currentColor"/>
      <line x1="4" y1="18" x2="20" y2="18"/><circle cx="8" cy="18" r="2" fill="currentColor"/>
    </svg>
  </button>
  <div id="panel"></div>
</div>
<div id="meter"><div></div><div></div><div></div></div>
<div id="error"></div>
<input id="file" type="file" accept="audio/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
